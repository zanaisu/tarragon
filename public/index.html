<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boat Battle FPS - 100 Player Battle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #001122;
            overflow: hidden;
            font-family: Arial, sans-serif;
            cursor: none;
        }
        
        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            font-size: 16px;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            z-index: 100;
            pointer-events: none;
        }
        
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: white;
        }
        
        #crosshair::before {
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
        }
        
        #crosshair::after {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
        }
        
        #playerList {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            z-index: 100;
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div>Health: <span id="health">100</span></div>
            <div>Boat Health: <span id="boatHealth">100</span></div>
            <div>Score: <span id="score">0</span></div>
            <div>Players: <span id="playerCount">0</span>/100</div>
            <div>Weapon: <span id="currentWeapon">rifle</span></div>
        </div>
        
        <div id="crosshair"></div>
        
        <div id="playerList">
            <h3>Players</h3>
            <div id="players"></div>
        </div>
        
        <div id="instructions">
            <div><strong>Controls:</strong></div>
            <div>WASD - Move boat/walk</div>
            <div>Mouse - Look around</div>
            <div>Click - Shoot</div>
            <div>F - Exit/Enter boat</div>
            <div>R - Reload weapon</div>
            <div>1-5 - Switch weapons</div>
            <div>Tab - Leaderboard</div>
            <div>Esc - Settings</div>
            <div>Enter - Chat</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script src="audio.js"></script>
    <script src="effects.js"></script>
    <script src="weapons.js"></script>
    <script src="physics.js"></script>
    <script src="ui.js"></script>
    <script src="game-advanced.js"></script>
</body>
</html>
